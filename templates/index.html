<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Recommender</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <i class="fas fa-play"></i>
            </div>
            <h1>Movie Recommender</h1>
            <p class="subtitle">Find movies similar to your favorites</p>
        </div>

        <div class="search-box">
            <i class="fas fa-search search-icon"></i>
            <input type="search" id="search" placeholder="Search for a movie..."
                   autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                   name="movie-search-xyz"
                   role="combobox" aria-expanded="false" aria-controls="suggestions"
                   aria-autocomplete="list" aria-label="Search for a movie">
            <button class="clear-btn" id="clearBtn" title="Clear" aria-label="Clear search">
                <i class="fas fa-times"></i>
            </button>
            <div id="suggestions" class="suggestions" role="listbox" aria-label="Movie suggestions"></div>
        </div>

        <div id="results" class="results" role="region" aria-label="Movie recommendations" aria-live="polite"></div>

        <div class="hint" id="hint">
            <i class="fas fa-lightbulb"></i>
            <span>Try searching for "The Dark Knight", "Inception", or "Avatar"</span>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
